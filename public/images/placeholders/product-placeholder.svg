<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="Product photo coming soon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7fa"/>
      <stop offset="1" stop-color="#e3e8ef"/>
    </linearGradient>
    <pattern id="stripes" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="44" height="44" fill="none"/>
      <rect width="2" height="44" fill="#a7b1be" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#stripes)"/>
  <g transform="translate(800 600)" fill="none" stroke="#a7b1be" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- simple salt-crystal cube -->
    <path d="M0 -150 L150 -75 L150 95 L0 170 L-150 95 L-150 -75 Z"/>
    <path d="M-150 -75 L0 0 L150 -75 M0 0 L0 170"/>
  </g>
</svg>
